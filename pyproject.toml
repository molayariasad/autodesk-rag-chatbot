[project]
name = "autodesk-rag-chatbot"
version = "1.0.0"
description = "RAG-based conversational chatbot for Autodesk product documentation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core ML & NLP
    "sentence-transformers>=3.0.0",
    "torch>=2.1.0",
    "transformers>=4.40.0",
    # Vector DB & Retrieval
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    # LLM Orchestration
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-huggingface>=0.1.0",
    # HTML Parsing & Data Processing
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
    "lxml>=5.0.0",
    "html2text>=2024.2.0",
    "markdownify>=0.13.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    # API & Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    # UI
    "streamlit>=1.38.0",
    "plotly>=5.22.0",
    # Evaluation
    "ragas>=0.2.0",
    "rouge-score>=0.1.2",
    # Web Search (for blended mode)
    "duckduckgo-search>=6.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
    "ddgs>=9.11.4",
    "trulens>=2.7.1",
    "trulens-providers-litellm>=2.7.1",
    "litellm>=1.82.3",
    "kaleido>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
